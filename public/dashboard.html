<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>variant-service</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36; --text: #e6e8ee;
    --muted: #8b93a7; --accent: #6aa9ff; --good: #3fb950; --warn: #d29922; --bad: #f85149;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 28px 32px 20px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0 0 4px; font-size: 20px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; }
  main { padding: 24px 32px 64px; max-width: 1180px; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 20px; }
  input, select, button {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 7px; padding: 8px 11px; font: inherit; font-size: 13px;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: #06101f; border-color: var(--accent); font-weight: 600; }
  button:hover { filter: brightness(1.1); }
  table { width: 100%; border-collapse: collapse; background: var(--panel);
          border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  th, td { padding: 11px 14px; text-align: left; border-bottom: 1px solid var(--line); }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: none; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .pill.good { background: rgba(63,185,80,.15); color: var(--good); }
  .pill.warn { background: rgba(210,153,34,.15); color: var(--warn); }
  .pill.bad  { background: rgba(248,81,73,.15); color: var(--bad); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 16px 18px; margin-bottom: 16px; }
  .card h2 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase;
             letter-spacing: 0.07em; color: var(--muted); }
  .verdict { font-size: 14px; line-height: 1.5; }
  .muted { color: var(--muted); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; font-size: 13px; }
  .kv dt { color: var(--muted); }
  .kv dd { margin: 0; font-variant-numeric: tabular-nums; }
  .bar { height: 5px; border-radius: 3px; background: var(--accent); min-width: 2px; }
  .err { color: var(--bad); font-size: 13px; }
  code { background: #0b0d11; border: 1px solid var(--line); border-radius: 4px;
         padding: 1px 5px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>variant-service</h1>
  <div class="sub">Experiment readout. Rates are Wilson intervals over unique visitors, not raw events.</div>
</header>
<main>
  <div class="row">
    <label class="sub">Experiment</label>
    <select id="exp"></select>
    <input id="token" placeholder="admin token" size="22" />
    <label class="sub">Goal</label>
    <input id="goal" placeholder="all" size="12" />
    <button class="primary" onclick="load()">Refresh</button>
    <span id="status" class="sub"></span>
  </div>
  <div id="out"></div>
</main>

<script>
const $ = (id) => document.getElementById(id);

// The admin token is kept in sessionStorage rather than localStorage so it does not
// outlive the tab, and is never placed in the URL where it would land in history.
function token() {
  let t = sessionStorage.getItem('vs_token');
  if (!t) { t = prompt('Admin token'); if (t) sessionStorage.setItem('vs_token', t); }
  return t || '';
}

async function listExperiments() {
  const res = await fetch('/admin/experiments?namespace=default', { headers: { 'x-admin-token': token() } });
  const data = await res.json();
  if (data.error) { $('status').textContent = 'auth required'; return; }
  const sel = $('exp');
  sel.innerHTML = '';
  (data.experiments || []).forEach((e) => {
    const o = document.createElement('option');
    o.value = e.id; o.textContent = `${e.id} (${e.status})`;
    sel.appendChild(o);
  });
  if (sel.value) load();
}

function esc(s) {
  // Content may be model-generated. textContent, never innerHTML, for the same reason
  // as the client snippet.
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

async function load() {
  const id = $('exp').value;
  if (!id) return;
  $('status').textContent = 'loading...';
  const goal = $('goal').value.trim();
  const url = `/admin/results/${id}?namespace=default` + (goal ? `&goal=${encodeURIComponent(goal)}` : '');
  const res = await fetch(url, { headers: { 'x-admin-token': token() } });
  const r = await res.json();
  $('status').textContent = '';
  if (r.error) { $('out').innerHTML = `<div class="err">${esc(r.error)}</div>`; return; }
  render(r);
}

function render(r) {
  const maxRate = Math.max(...r.variants.map((v) => v.confidenceIntervalPct.upper), 0.01);
  const srmClass = r.srm.mismatch ? 'bad' : (r.srm.checked ? 'good' : 'warn');
  const srmText = r.srm.mismatch ? 'MISMATCH' : (r.srm.checked ? 'consistent' : 'not checked');

  const rows = r.variants.map((v) => `
    <tr>
      <td><strong>${esc(v.variantKey)}</strong>
          ${v.liftVsControl === null ? '<span class="muted"> (control)</span>' : ''}</td>
      <td class="num">${v.exposures.toLocaleString()}</td>
      <td class="num">${v.conversions.toLocaleString()}</td>
      <td class="num muted">${v.rawExposureEvents.toLocaleString()}</td>
      <td class="num">${(v.conversionRate * 100).toFixed(2)}%</td>
      <td class="num muted">[${v.confidenceIntervalPct.lower.toFixed(2)}%, ${v.confidenceIntervalPct.upper.toFixed(2)}%]</td>
      <td class="num">${v.liftVsControl === null ? '—' : (v.liftVsControl * 100).toFixed(1) + '%'}</td>
      <td class="num">${v.liftPValue === null ? '—' : v.liftPValue.toFixed(4)}</td>
      <td>${v.significant ? '<span class="pill good">clear</span>' : '<span class="pill warn">overlapping</span>'}</td>
      <td>${v.unattributedConversions > 0 ? `<span class="pill warn">${v.unattributedConversions}</span>` : '<span class="muted">0</span>'}</td>
    </tr>`).join('');

  $('out').innerHTML = `
    <div class="card">
      <h2>Verdict</h2>
      <div class="verdict">${esc(r.interpretation)}</div>
    </div>
    <div class="card">
      <h2>Per variant</h2>
      <table>
        <thead><tr>
          <th>Variant</th><th class="num">Exposed</th><th class="num">Converted</th>
          <th class="num">Raw events</th><th class="num">Rate</th><th class="num">95% CI</th>
          <th class="num">Lift</th><th class="num">p</th><th>Verdict</th><th>Unattributed</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="sub" style="margin-top:10px">
        “Raw events” is the number of beacons received and is shown only to expose client
        duplication. Rates use unique visitors, so a visitor who saw a page eight times
        counts once.
      </div>
    </div>
    <div class="card">
      <h2>Integrity</h2>
      <div class="row" style="margin-bottom:10px">
        <span>Sample ratio mismatch:</span> <span class="pill ${srmClass}">${srmText}</span>
        <span class="muted">${esc(r.srm.reason)}</span>
      </div>
      <dl class="kv">
        <dt>chi-square</dt><dd>${r.srm.chiSquare.toFixed(3)} (df ${r.srm.degreesOfFreedom})</dd>
        <dt>p-value</dt><dd>${r.srm.pValue.toFixed(4)}</dd>
        <dt>Status</dt><dd>${esc(r.status)}</dd>
        <dt>Traffic allocated</dt><dd>${(r.allocationBps / 100).toFixed(2)}%</dd>
        <dt>Total exposed</dt><dd>${r.totalExposures.toLocaleString()}</dd>
        <dt>Sample needed for 20% lift</dt><dd>${r.powerHint === null ? '—' : r.powerHint.toLocaleString() + ' per variant'}</dd>
        <dt>Generated</dt><dd>${esc(r.generatedAt)}</dd>
      </dl>
    </div>`;
}

$('token').value = token();
listExperiments();
</script>
</body>
</html>
